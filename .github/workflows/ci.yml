name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 fan-rpm.c -framework IOKit -framework CoreFoundation -o fan-rpm
          sh -n fan
          ./fan -v
          ./fan -h
